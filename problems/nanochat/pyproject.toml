[project]
name = "autoresearch-env"
version = "0.1.0"
description = "RL environment for training models to improve karpathy/autoresearch"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.0",
    "datasets",
]

[project.entry-points."verifiers.envs"]
autoresearch = "autoresearch_env:load_environment"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
